---
- name: Setup complet Fedora
  hosts: all

  roles:

    # ---------------------------------------------------------------
    # Environnement utilisateur (fusion des anciens petits rôles)
    # ---------------------------------------------------------------
    - role: user_environment
      tags:
        - user_env
        - user_env::bash
        - user_env::binfiles
        - user_env::dotfiles
        - user_env::packages
        - user_env::vagrant
      when: workstation_enable_vagrant or workstation_enable_virtualization

    # ---------------------------------------------------------------
    # Outils de développement
    # ---------------------------------------------------------------
    - role: devtools
      tags:
        - devtools
        - devtools::docker
        - devtools::podman
        - devtools::c_cpp
        - devtools::vscode
        - devtools::vscodium
        - devtools::jetbrains
      when: workstation_enable_docker or workstation_enable_podman

    # ---------------------------------------------------------------
    # Git + SSH + API GitHub
    # ---------------------------------------------------------------
    - role: git
      tags:
        - git
        - git::ssh
        - git::config
        - git::github_api
      # Toujours exécuté → pas de condition

    # ---------------------------------------------------------------
    # Virtualisation (contrôlée par variable globale)
    # ---------------------------------------------------------------
    - role: virtualization
      tags:
        - virtualization
        - virtualization::packages
        - virtualization::libvirtd
        - virtualization::groups
        - virtualization::polkit
      when: workstation_enable_virtualization

    # ---------------------------------------------------------------
    # Configuration avancée libvirt (uniquement sur l’hôte)
    # ---------------------------------------------------------------
    - role: libvirt_config
      tags:
        - virtualization
        - virtualization::libvirt_config
        - libvirt_fix
      when:
        - workstation_enable_virtualization
        - ansible_facts.virtualization_role != "guest"
